# HSTS: só é enviado quando a conexão é HTTPS (nginx omite header com valor vazio)
map $scheme $hsts_header {
    https "max-age=31536000; includeSubDomains; preload";
    default "";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker não pode ser imutável — senão o browser nunca atualiza o PWA (e mantém CSP antigo no precache)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache longo para assets com hash no nome (js, css, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    # Placeholders __CSP_*__ sao substituidos em tempo de build pelo Dockerfile
    # (build args CSP_API_URL / CSP_WS_URL / CSP_IMG_SRC). Nao editar aqui.
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: __CSP_IMG_SRC__ https://api.mapbox.com https://*.tile.openstreetmap.org https://learn.microsoft.com; connect-src 'self' https://api.opencagedata.com https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org https://login.microsoftonline.com __CSP_API_URL__ __CSP_WS_URL__;";
    add_header Strict-Transport-Security $hsts_header;

    # HTML nunca pode ser cacheado (nem o SW nem o browser) — CSP/atualizações sempre frescos
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
