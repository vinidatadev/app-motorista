# Builda as 2 imagens e publica no Docker Hub a cada push na main.
# Resultado:
#   vinidatadev/app-motorista-backend:{latest, <sha>}
#   vinidatadev/app-motorista-frontend:{latest, <sha>}
#
# Secrets/vars necessarias no GitHub (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME            (secret)
#   DOCKERHUB_TOKEN               (secret — gerar em https://hub.docker.com > Account Settings > Security)
#   VITE_API_URL                  (secret — ex.: https://backend.seudominio.com)
#   VITE_MAPBOX_TOKEN             (secret)
#   VITE_OPENCAGE_KEY             (secret)
#   CSP_API_URL                   (secret — ex.: https://backend.seudominio.com)
#   CSP_WS_URL                    (secret — ex.: wss://backend.seudominio.com)
#   CSP_IMG_SRC                   (secret — ex.: https://storage.seudominio.com)

name: Build & Push Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FRONTEND_IMAGE: vinidatadev/app-motorista-frontend
  BACKEND_IMAGE: vinidatadev/app-motorista-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
            VITE_OPENCAGE_KEY=${{ secrets.VITE_OPENCAGE_KEY }}
            NGINX_CONF=nginx.conf
            CSP_API_URL=${{ secrets.CSP_API_URL }}
            CSP_WS_URL=${{ secrets.CSP_WS_URL }}
            CSP_IMG_SRC=${{ secrets.CSP_IMG_SRC }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max