server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker não pode ser imutável — senão o browser nunca atualiza o PWA (e mantém CSP antigo no precache)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # CSP liberado para dev local — permite Leaflet tiles Mapbox/OSM, OpenCage e Nominatim
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.mapbox.com https://*.tile.openstreetmap.org https://learn.microsoft.com; connect-src 'self' http://localhost:8000 https://api.opencagedata.com https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org https://login.microsoftonline.com;";

    # HTML nunca pode ser cacheado (nem o SW nem o browser) — CSP/atualizações sempre frescos
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
